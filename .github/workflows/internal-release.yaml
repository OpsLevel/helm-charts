name: Internal Release

# Publishes charts/opslevel to Replicated's Helm-Unstable channel when a merge to main bumps its version, so
# internal environments that follow that channel pick it up. The customer release (task public-release) stays manual.

on:
  push:
    branches: [main]
    paths:
      - charts/opslevel/Chart.yaml

permissions:
  contents: read

concurrency:
  group: internal-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      -
        name: Check for a version bump
        id: bump
        run: |
          before=$(git show "${{ github.event.before }}:charts/opslevel/Chart.yaml" 2>/dev/null | yq '.version' || true)
          after=$(yq '.version' charts/opslevel/Chart.yaml)
          echo "version $before -> $after"
          [ "$before" != "$after" ] && echo "changed=true" >> "$GITHUB_OUTPUT" || true
      -
        name: Install Helm
        if: steps.bump.outputs.changed == 'true'
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          # Not the newest Helm on purpose: registry.replicated.com serves a different replicated 1.18.0 subchart to
          # newer clients (3.22 gets an empty replicatedAppEndpoint and no integration.enabled). Stay on 3.17.2,
          # which gets the subchart laptop releases have shipped, until that difference is understood.
          version: v3.17.2
      -
        name: Install Task
        if: steps.bump.outputs.changed == 'true'
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Install Replicated CLI
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: 0.129.16
          SHA256: 3af738be1ee5e41b9e014399459348c217b38f152cde15ebe0c35ba3c180fd46
        run: |
          curl -fsSLo replicated.tar.gz "https://github.com/replicatedhq/replicated/releases/download/v${VERSION}/replicated_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  replicated.tar.gz" | sha256sum -c -
          tar -xzf replicated.tar.gz replicated
          sudo mv replicated /usr/local/bin/
          rm replicated.tar.gz
      -
        name: Publish to Helm-Unstable
        if: steps.bump.outputs.changed == 'true'
        env:
          REPLICATED_API_TOKEN: ${{ secrets.REPLICATED_API_TOKEN }}
        run: task internal-release
