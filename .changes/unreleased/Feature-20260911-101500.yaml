kind: Feature
body: Add `integrations.pagerduty.secret.appAuthorizationUrl`, `.appTokenUrl` and `.apiUrl`
  so self-hosted instances can point the PagerDuty integration at a non-US service
  region (e.g. EU). Leaving them blank keeps the existing US endpoints.
