kind: Feature
body: 'Every chart-managed Secret can now be replaced with one you manage yourself, such as from Vault Secrets Operator or External Secrets. `opslevel.secret.create`/`name`, `opssight.secret.create` and the new `faktory.secret.create` are honored, and the new `global.imagePullSecrets` takes a list of existing pull secrets in place of rendering `opslevel-pull-secret` from `dockerconfigjson`. Each credential now lives only in its own Secret. The app reads the MySQL, Elasticsearch and Faktory passwords from `opslevel-mysql`, `opslevel-elasticsearch` and `opslevel-faktory` and builds `FAKTORY_URL` itself, and OpsSight reads the Postgres and Redis passwords from `opslevel-postgres` and `opslevel-redis`. The `opslevel` and `opssight` Secrets hold only their own keys, and the non-secret database and Elasticsearch connection settings moved to the `opslevel` ConfigMap. If you use an external MySQL with `mysql.secret.create: false`, you must now provide the `opslevel-mysql` Secret with a `MYSQL_ROOT_PASSWORD` key.'
time: 2026-11-26T12:00:00.000000-05:00
