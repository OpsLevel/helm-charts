kind: Feature
body: 'You can now supply the opslevel, OpsSight, Faktory and image pull Secrets yourself, such as from Vault Secrets Operator or External Secrets, as you already could for MySQL, Postgres, Redis, Elasticsearch, MinIO, the runner and the integrations. `opslevel.secret.create`/`name`, `opssight.secret.create` and the new `faktory.secret.create` are honored. The new `global.imagePullSecrets` (`[{name: ...}]`) points pods at existing pull secrets instead of rendering `opslevel-pull-secret` from `dockerconfigjson`. A Secret you supply no longer has to repeat other components'' passwords. The app reads the MySQL, Elasticsearch and Faktory passwords from `opslevel-mysql`, `opslevel-elasticsearch` and `opslevel-faktory` and builds `FAKTORY_URL` itself, and OpsSight reads the Postgres and Redis passwords from `opslevel-postgres` and `opslevel-redis`. A supplied `opslevel` Secret needs only the app''s own keys (listed in values.yaml), and a supplied `opssight` Secret needs only `SECRET_KEY_BASE`. Object-storage keys are still read from the `opslevel` Secret. If you use an external MySQL or Postgres with `secret.create: false`, you must now provide `opslevel-mysql` (key `MYSQL_ROOT_PASSWORD`) or `opslevel-postgres` (key `POSTGRES_PASSWORD`).'
time: 2026-11-26T12:00:00.000000-05:00
